<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f33" />

    <!-- Default SEO (per-page values are set at runtime from src/data/site.ts) -->
    <title>Walsall Enterprise Ltd | Wholesale used goods, exported by the container</title>
    <meta
      name="description"
      content="Walsall Enterprise Ltd sorts, grades and packs used bric-a-brac, toys, bedding and books in Walsall, UK, and ships them as full container loads to importers in Asia, Europe and Africa. Priced per kg."
    />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Walsall Enterprise Ltd" />
    <meta property="og:title" content="Walsall Enterprise Ltd | Wholesale used goods, exported by the container" />
    <meta
      property="og:description"
      content="Graded used goods sold per kg and loaded by the container in Walsall, UK, for importers in Asia, Europe and Africa."
    />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:image" content="https://www.example.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Business details for search engines. Update "url" when the domain is live. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Walsall Enterprise Ltd",
        "description": "Wholesale exporter of sorted second-hand goods (bric-a-brac, toys, bedding and books), sold per kg by the full 40ft container.",
        "url": "https://www.example.com/",
        "image": "https://www.example.com/og-image.jpg",
        "telephone": "+447922247247",
        "email": "walsallenterpriseltd@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit 2, Smith Road, CLA Fabrication Building, Bay 1-3",
          "addressLocality": "Walsall",
          "postalCode": "WS10 0PD",
          "addressRegion": "West Midlands",
          "addressCountry": "GB"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "identifier": { "@type": "PropertyValue", "propertyID": "Companies House", "value": "15317895" },
        "areaServed": ["Philippines", "Thailand", "Pakistan", "Europe", "Africa"]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
